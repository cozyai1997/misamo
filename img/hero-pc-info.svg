<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 250" role="img" aria-label="">
  <!-- EDIT: PC information banner artwork. Replace this SVG to change the desktop banner image. -->
  <defs>
    <linearGradient id="infoDesk" x1="36" y1="205" x2="430" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9f5ff"/>
      <stop offset="1" stop-color="#ecfff5" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="infoCard" x1="68" y1="42" x2="210" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dceaff"/>
    </linearGradient>
    <linearGradient id="infoLaptop" x1="226" y1="143" x2="333" y2="219" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#edf7ff"/>
      <stop offset="1" stop-color="#86abd8"/>
    </linearGradient>
    <filter id="infoShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="13" flood-color="#5686a9" flood-opacity=".15"/>
    </filter>
    <filter id="infoGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#58a8ff" flood-opacity=".75"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#4dd6a6" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect x="35" y="205" width="392" height="45" rx="7" fill="url(#infoDesk)"/>
  <g filter="url(#infoShadow)">
    <rect x="62" y="42" width="138" height="154" rx="18" fill="url(#infoCard)" stroke="#b8cdf6" stroke-width="5"/>
    <rect x="86" y="67" width="72" height="9" rx="4" fill="#9bb6e6"/>
    <rect x="86" y="88" width="88" height="7" rx="3.5" fill="#d5e1f5"/>
    <rect x="86" y="106" width="58" height="7" rx="3.5" fill="#d5e1f5"/>
    <rect x="89" y="140" width="18" height="32" rx="5" fill="#70c6aa"/>
    <rect x="119" y="119" width="18" height="53" rx="5" fill="#8ba7ff"/>
    <rect x="149" y="130" width="18" height="42" rx="5" fill="#ffc173"/>
  </g>
  <g>
    <rect x="218" y="144" width="118" height="75" rx="10" fill="#83a8d5"/>
