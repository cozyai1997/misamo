    <path d="M348 100c10-20 22-29 43-35" fill="none" stroke="#6ec7ae" stroke-width="8" stroke-linecap="round"/>
    <path d="M348 100l20 2-9-18" fill="none" stroke="#6ec7ae" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
